services:
  - type: web
    name: eatcode-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma migrate deploy && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
